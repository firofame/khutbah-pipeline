[project]
name = "khutbah-pipeline"
version = "0.1.0"
description = "Automated Friday Jumma Khutbah Translation, TTS, and WhatsApp Distribution Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "google-api-python-client",
    "google-auth-httplib2",
    "hijri-converter>=2.3.0",
    "requests>=2.28.0",
]

[project.scripts]
khutbah = "pipeline:main"
